// Use the 'plugins' block for modern Gradle. It's cleaner.
plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt' // For annotation processing like Moshi
    id 'kotlin-parcelize' // Add this for @Parcelize support, which was part of the old extensions
}

android {
    // Update SDK versions to be more current
    compileSdk 36 // Changed from 30

    defaultConfig {
        applicationId "com.becarios.pokedex"
        minSdkVersion 21
        targetSdkVersion 34 // Changed from 30
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // This block is needed to enable View Binding
    buildFeatures {
        viewBinding true
    }

    // Set the Java version for compatibility with modern Gradle and libraries
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // We no longer need buildToolsVersion with modern Android Gradle Plugins
}

// Variables for dependency versions can be moved to the top-level build.gradle if you prefer
ext {
    glideVersion = "4.16.0" // Updated Glide version
    retrofitVersion = "2.9.0" // Updated Retrofit version
    moshiVersion = "1.15.0" // Updated Moshi version
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    // Use the kotlin_version defined in your root build.gradle
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // Updated AndroidX libraries
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // Updated ConstraintLayout
    implementation 'com.google.android.material:material:1.12.0' // Updated Material Design

    // 'lifecycle-extensions' is deprecated. Use specific lifecycle artifacts instead.
    // For ViewModel:
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    // For LiveData:
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.7.0"
    // For lifecycle-aware coroutine scopes:
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"


    // Square Retrofit & Moshi
    implementation "com.squareup.retrofit2:retrofit:$retrofitVersion"
    implementation "com.squareup.retrofit2:converter-moshi:$retrofitVersion"
    implementation "com.squareup.moshi:moshi-kotlin:$moshiVersion"
    kapt "com.squareup.moshi:moshi-kotlin-codegen:$moshiVersion"

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Glide (image loading)
    implementation "com.github.bumptech.glide:glide:$glideVersion"
    // Use 'kapt' instead of 'annotationProcessor' for Glide in Kotlin projects
    kapt "com.github.bumptech.glide:compiler:$glideVersion"

    // JUnit Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Toasty is a custom toast library, leaving it as is.
    implementation 'com.github.GrenderG:Toasty:1.2.5'
}
